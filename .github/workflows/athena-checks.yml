name: Athena checks

on:
  push:
    branches: ["feat/adaptive-matchmaking-time-strategy"]
  pull_request:
    branches: ["fix/embedded-ai-chatbot", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Build engine
        run: make clean && make athena ARCH=
      - name: Run engine and Python tests
        run: make test
      - name: Validate Lichess configuration
        run: python -c "import yaml; yaml.safe_load(open('lichess/config.yml', encoding='utf-8')); print('YAML syntax OK')"
      - name: Check shell launcher syntax
        run: bash -n lichess/run.sh
