name: build-and-test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: athena-linux-x86_64,  exe: athena }
          - { os: windows-latest, name: athena-windows-x86_64, exe: athena.exe }
          - { os: macos-latest,   name: athena-macos,          exe: athena }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: g++ -O3 -std=c++17 -pthread -DNDEBUG -march=x86-64-v2 -static -o athena src/main.cpp

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: g++ -O3 -std=c++17 -pthread -DNDEBUG -march=x86-64-v2 -static -o athena.exe src/main.cpp

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: clang++ -O3 -std=c++17 -pthread -DNDEBUG -o athena src/main.cpp

      - name: Perft correctness test
        shell: bash
        run: |
          g++ -O2 -std=c++17 -o perft_test tests/perft.cpp || clang++ -O2 -std=c++17 -o perft_test tests/perft.cpp
          ./perft_test

      - name: UCI smoke test (handshake, book move, search)
        shell: bash
        run: |
          printf 'uci\nisready\nposition startpos\ngo movetime 300\n' > smoke.txt
          (cat smoke.txt; sleep 2; echo quit) | ./${{ matrix.exe }} | tee out.txt
          grep -q "uciok" out.txt
          grep -q "bestmove" out.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.exe }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Package
        run: |
          cd dist
          for d in */; do n=${d%/}; (cd $n && zip -q ../$n.zip *); done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
