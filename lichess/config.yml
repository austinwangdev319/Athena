token: "set-via-LICHESS_BOT_TOKEN-env-var"
url: "https://lichess.org/"

engine:
  dir: "./engines/"
  name: "athena"
  working_dir: "./engines/"
  protocol: "uci"
  ponder: false
  polyglot:
    enabled: false
  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false
  online_moves:
    lichess_opening_explorer:
      enabled: false
    lichess_cloud_analysis:
      enabled: false
    online_egtb:
      enabled: false
  uci_options:
    Move Overhead: 80
    Threads: 1
    Hash: 256
    OwnBook: true
    TimeUse: 80
    GambitRisk: 100
    Aggression: 165
    Contempt: 25

abort_time: 30
fake_think_time: false
rate_limiting_delay: 0
move_overhead: 150
max_takebacks_accepted: 0
quit_after_all_games_finish: false

correspondence:
  move_time: 60
  checkin_period: 300
  disconnect_time: 150
  ponder: false

challenge:
  concurrency: 3
  games_reserved_for_humans: 1
  sort_by: "best"
  preference: "bot"
  accept_bot: true
  only_bot: false
  max_increment: 20
  min_increment: 0
  max_base: 1800
  min_base: 15
  variants:
    - standard
  time_controls:
    - blitz
    - rapid
    - bullet
  # Keep games casual by default while testing the bot integration.
  modes:
    - casual
    - rated
  max_simultaneous_games_per_user: 2

greeting:
  hello: "Hi! I'm Athena, built by Austin. Remember to read the board, not just toss pieces around. Good Luck, you'll need it. "
  goodbye: "Good game."
  hello_spectators: "Ahh, witness. Excellente! Let's see who forgets their opening prep first."
  goodbye_spectators: "Now go watch GothamChess."

pgn_directory: "game_records"
pgn_file_grouping: "game"

matchmaking:
  allow_matchmaking: true
  allow_during_games: true
  challenge_variant: "standard"
  challenge_timeout: 5
  challenge_initial_time:
    - 60
    - 180
    - 300
  challenge_increment:
    - 1
    - 2
  opponent_rating_difference: 300
  rating_preference: "none"
  challenge_mode: "rated"
  challenge_filter: "coarse"
