# Athena Lichess-bot configuration template.
# The official lichess-bot runner replaces this token from the
# LICHESS_BOT_TOKEN environment variable at startup. Never commit a real token.
token: "set-via-LICHESS_BOT_TOKEN-env-var"
url: "https://lichess.org/"

engine:
  dir: "./engines/"
  name: "athena"
  working_dir: "./engines/"
  protocol: "uci"
  ponder: false
  polyglot:
    enabled: false
  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false
  online_moves:
    lichess_opening_explorer:
      enabled: false
    lichess_cloud_analysis:
      enabled: false
    online_egtb:
      enabled: false
  uci_options:
    Move Overhead: 150
    Threads: 1
    Hash: 256
    OwnBook: true
    GambitRisk: 60
    Aggression: 80
    Contempt: 25

abort_time: 30
fake_think_time: false
rate_limiting_delay: 0
move_overhead: 2000
max_takebacks_accepted: 0
quit_after_all_games_finish: false

correspondence:
  move_time: 60
  checkin_period: 300
  disconnect_time: 150
  ponder: false

challenge:
  concurrency: 1
  games_reserved_for_humans: 0
  sort_by: "best"
  preference: "bot"
  accept_bot: true
  only_bot: false
  max_increment: 20
  min_increment: 0
  max_base: 1800
  min_base: 15
  variants:
    - standard
  time_controls:
    - blitz
    - rapid
    - bullet
  # Keep games casual by default while testing the bot integration.
  modes:
    - casual
  max_simultaneous_games_per_user: 2

greeting:
  hello: "Hi, I'm Athena, an original gambit-playing engine by Austin Wang. Good luck."
  goodbye: "Good game."
  hello_spectators: "Athena here. Source: see my profile."
  goodbye_spectators: "Thanks for watching."

matchmaking:
  # Automatically challenge other Lichess bots when idle.
  # Lichess currently limits bot-vs-bot games to 100 per day.
  allow_matchmaking: true
  allow_during_games: false
  challenge_variant: "standard"
  challenge_timeout: 5
  challenge_initial_time:
    - 180
  challenge_increment:
    - 2
  opponent_rating_difference: 300
  rating_preference: "none"
  challenge_mode: "casual"
  challenge_filter: "coarse"
