# Athena Lichess-bot configuration template.
# The official lichess-bot runner replaces this token from the
# LICHESS_BOT_TOKEN environment variable at startup. Never commit a real token.
token: "set-via-LICHESS_BOT_TOKEN-env-var"
url: "https://lichess.org/"

engine:
  dir: "./engines/"
  name: "athena"
  working_dir: "./engines/"
  protocol: "uci"
  ponder: false
  polyglot:
    enabled: false
  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false
  online_moves:
    lichess_opening_explorer:
      enabled: false
    lichess_cloud_analysis:
      enabled: false
    online_egtb:
      enabled: false
  uci_options:
    Move Overhead: 80
    Threads: 1
    Hash: 256
    OwnBook: true
    TimeUse: 100
    GambitRisk: 100
    Aggression: 110
    Contempt: 25

abort_time: 30
fake_think_time: false
rate_limiting_delay: 0
move_overhead: 150
max_takebacks_accepted: 0
quit_after_all_games_finish: false

correspondence:
  move_time: 60
  checkin_period: 300
  disconnect_time: 150
  ponder: false

challenge:
  concurrency: 3
  games_reserved_for_humans: 0
  sort_by: "first"
  preference: "bot"
  accept_bot: true
  only_bot: false
  max_increment: 20
  min_increment: 0
  max_base: 1800
  min_base: 15
  variants:
    - standard
  time_controls:
    - blitz
    - rapid
    - bullet
  modes:
    - rated
  # Incoming challenges must be within +/-150 rating points.
  # Outgoing casual training challenges are sent by tools/matchmaking.py.
  rating_difference: 150
  max_simultaneous_games_per_user: 2

greeting:
  hello: "Hi! I'm Athena, built by Austin. Good luck, you'll need it."
  goodbye: "Good game."
  hello_spectators: "Ahh a witness! U ready to see me crush my opponent?"
  goodbye_spectators: "Thanks for watching."

pgn_directory: "game_records"
pgn_file_grouping: "game"

matchmaking:
  # Outgoing challenges are managed by tools/matchmaking.py for asymmetric rating bands.
  # Keep the random built-in matcher disabled so it cannot bypass that policy.
  allow_matchmaking: false
  allow_during_games: true
  challenge_variant: "standard"
  challenge_timeout: 1
  challenge_initial_time:
    - 180
    - 300
  challenge_increment:
    - 0
    - 2
  opponent_rating_difference: 150
  rating_preference: "high"
  challenge_mode: "rated"
  challenge_filter: "fine"
